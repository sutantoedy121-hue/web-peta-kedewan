<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masuk · Admin Kedewan</title>
<link rel="stylesheet" href="css/admin.css" />
</head>
<body class="login-page">

<div class="login-card">
  <div class="login-brand">
    <span class="login-brand__icon" id="loginBrandIcon">
      <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="19" stroke="currentColor" stroke-width="1.4"/><path d="M20 8v24M8 20h24" stroke="currentColor" stroke-width="1.4"/><circle cx="20" cy="20" r="4" fill="currentColor"/></svg>
    </span>
    <span>
      <strong id="loginBrandName">Kedewan</strong>
      <small>Panel Admin</small>
    </span>
  </div>

  <h1>Masuk ke Panel Admin</h1>
  <p class="section-hint">Gunakan akun admin yang terdaftar di Supabase Auth.</p>

  <div class="form-error" id="loginError"></div>

  <form id="loginForm">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username" placeholder="admin@kedewan.go.id" />
    </div>
    <div class="field">
      <label for="password">Kata Sandi</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
    </div>
    <button type="submit" class="btn btn--primary btn--block" id="loginBtn">Masuk</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="js/admin-brand.js"></script>
<script src="js/login.js"></script>
</body>
</html>
